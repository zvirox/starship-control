[package]
name = "starship-control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
starship-core = { path = "../../crates/starship-core" }
starship-db = { path = "../../crates/starship-db" }
starship-health = { path = "../../crates/starship-health" }
starship-infer = { path = "../../crates/starship-infer" }
starship-mcp = { path = "../../crates/starship-mcp" }
starship-plugin = { path = "../../crates/starship-plugin" }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts", "notification"] }
futures.workspace = true
uuid.workspace = true
dirs.workspace = true

[build-dependencies]
tauri-build = { version = "2.2", features = [] }
