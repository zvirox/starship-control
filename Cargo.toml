[workspace]
resolver = "3"
members = [
    "app/src-tauri",
    "crates/starship-core",
    "crates/starship-infer",
    "crates/starship-mcp",
    "crates/starship-plugin",
    "crates/starship-db",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Starship Control Contributors"]
license = "Apache-2.0"
repository = "https://github.com/zvirox/starship-control"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.33", features = ["bundled", "backup", "uuid"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
dirs = "6.0"
tempfile = "3.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
