name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: zvirox/release-workflows/.github/workflows/linux-release.yml@v1
    with:
      app_name: starship-control
      frontend_dir: app
      build_cmd: cargo build --release --locked -p starship-control
      binary_path: target/release/starship-control
      nfpm_config: packaging/nfpm.yaml
    secrets: inherit
