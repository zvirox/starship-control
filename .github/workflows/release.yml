name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-no-fakes:
    name: No-Fakes Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run no-fakes gate
        run: cargo xtask check-no-fakes

  release:
    needs: check-no-fakes
    uses: zvirox/release-workflows/.github/workflows/linux-release.yml@v1
    with:
      app_name: ${{ github.event.repository.name }}
      frontend_dir: app
      build_cmd: cargo build --release --locked -p starship-control
      binary_path: target/release/starship-control
      nfpm_config: packaging/nfpm.yaml
      check_version_flag: true
    secrets: inherit
