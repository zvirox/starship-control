name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format-and-lint:
    name: Code Quality & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Ensure frontend dist exists
        run: mkdir -p app/dist && touch app/dist/index.html

      - name: Rust formatting check
        run: cargo fmt --check

      - name: Rust clippy verification (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: No-fakes gate (Phase 17)
        run: cargo xtask check-no-fakes

      - name: Install frontend dependencies
        run: |
          cd app
          npm ci

      - name: Frontend typecheck & lint
        run: |
          cd app
          npx tsc --noEmit
          npm run lint

  test-workspace:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Ensure frontend dist exists
        run: mkdir -p app/dist && touch app/dist/index.html

      - name: Run workspace tests
        run: cargo test --workspace --verbose

  frontend-build:
    name: Frontend Asset Compilation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies & compile
        run: |
          cd app
          npm ci
          npm run build

  smoke-test:
    name: CLI & Runtime Self-Test
    runs-on: ubuntu-24.04
    needs: [format-and-lint, test-workspace]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Build frontend
        run: |
          cd app
          npm ci
          npm run build

      - name: Build binary
        run: cargo build -p starship-control

      - name: Verify --version flag
        run: target/debug/starship-control --version

      - name: Verify --self-test flag
        run: target/debug/starship-control --self-test

  coverage:
    name: Coverage Baseline (llvm-cov)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Ensure frontend dist exists
        run: mkdir -p app/dist && touch app/dist/index.html

      - name: Run coverage
        run: |
          cargo llvm-cov --workspace --text --output-path coverage.txt || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust security audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  security-suite:
    name: Security Mutation Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust security suite
        run: cargo test -p starship-mcp --test security_suite --verbose

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Run renderer XSS + mutation suite
        run: |
          cd app
          npm ci
          npm run test:security

  performance-budget:
    name: Performance Budgets (warn-only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsqlite3-dev \
            xvfb

      - name: Build frontend
        run: |
          cd app
          npm ci
          npm run build

      - name: Build release binary and budget runner
        run: |
          cargo build --release -p starship-control
          cargo build -p xtask --bin perf_budget

      - name: Run performance budget probe (warn-only)
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a cargo run -q -p xtask --bin perf_budget -- \
            --binary target/release/starship-control --idle-secs 6 --warn-only
